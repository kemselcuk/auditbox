# Local profile: run the app on the host against the docker compose PostgreSQL
# from this repository (docker compose up -d db). Every value can be overridden
# via environment variables; the defaults match .env.example and are safe locally.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auditbox}
    username: ${DB_USER:auditbox}
    password: ${DB_PASSWORD:auditbox}

# Safe local development key (D5/D18): the documented development plaintext key
# 'local-dev-key' configured as its SHA-256 digest
# (printf %s 'local-dev-key' | sha256sum) — the server never stores the plaintext key.
# Override with API_KEYS for anything exposed; comma-separated entries, and listing a
# second digest for the same source opens a rotation overlap window.
auditbox:
  security:
    api-keys: ${API_KEYS:local-dev:ed5a18fb8f807f996d649e379d3f35f39c543a91bdbf88c492f2ebd10d4df86c}
