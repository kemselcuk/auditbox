# AuditBox base configuration. Profile-specific files: application-local.yml, application-test.yml.

spring:
  application:
    name: auditbox
  autoconfigure:
    exclude:
      # The static X-API-Key chain (D5) is the only authentication mechanism; Boot's default
      # in-memory user and its generated-password log line are unused (T5.1).
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
  jackson:
    deserialization:
      # Exact client decimals (D10): JSON floats are read as BigDecimal so high-precision
      # values survive request parsing end to end (1.00000000000000000001 != 1). Hibernate's
      # jsonb read path needs the same feature: see JsonFormatMapperConfiguration.
      use-big-decimal-for-floats: true
    write:
      # Stable numeric rendering (review round 2, F4): BigDecimal values are written as
      # plain decimals without exponent notation (1e+3 -> 1000, 1e-7 -> 0.0000001), so the
      # 201 in-memory body renders exactly like the 200/409 jsonb-read form.
      WRITE_BIGDECIMAL_AS_PLAIN: true
    factory:
      constraints:
        read:
          # Aligned with the metadata number bounds of ValidMetadataValidator (review round
          # 2, F1/F2 and re-review blockers B1/B2): an accepted metadata number has at most
          # 1000 integer + 1000 fractional digits in canonical (trailing-zeros-stripped)
          # form and at most 4000 total digits in its stored (unstripped, literal-scale)
          # form — up to 4003 characters including sign, decimal point and leading zero
          # (4001 digits; this limit counts digits, e.g. an idempotent retry that echoes the
          # API response verbatim). Jackson's default 1000 would 400 such legal
          # literals; oversized/bound-exceeding numbers are rejected with a precise field
          # error by the validator instead.
          max-number-length: 4096
  jpa:
    # The database schema is owned by Flyway migrations (from Stage 2 on); Hibernate only
    # validates. With no entities in Stage 1, validate is a no-op against the empty schema
    # (verified by the Testcontainers integration test).
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    hikari:
      # M11 review F1: a record request now uses ONE connection at a time (the advisory
      # lock + pre-check + insert run in a single transaction; a unique-violation recovery
      # runs strictly after that transaction rolled back). The pool therefore bounds
      # concurrent write throughput only — no pool size can deadlock the write path.
      maximum-pool-size: 32

management:
  endpoints:
    web:
      exposure:
        # Milestone 9.4: metrics joins health/info. Every actuator endpoint except
        # health stays behind the static API key (ApiKeySecurityConfiguration).
        include: health,info,metrics

# Per-source API key registry (D18, hardening of D5): comma-separated source:sha256hex
# entries bound from the API_KEYS environment variable, where sha256hex is the SHA-256
# digest of each plaintext key (plaintext keys are never stored or logged). Blank by
# default — an empty registry authenticates nothing, so a profile-less run denies every
# protected request (public: only /actuator/health/**). A malformed entry aborts startup
# in every profile; the prod profile additionally fails fast (ApiKeyProdRequirement) when
# the value is blank or parses to zero entries.
auditbox:
  security:
    api-keys: ${API_KEYS:}
  # In-memory per-source token-bucket rate limiting (M10.2/D19): capacity and refill rate
  # in requests per minute (refill is continuous at limit/60 per second), applied only to
  # authenticated requests. Single-instance only — see docs/decisions.md D19. Enabling the
  # limiter with fewer than 1 request per minute aborts startup.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:300}
  # Retention and automatic partition maintenance (M11.2/D22): at startup and daily at
  # 03:30 server time the job creates the missing monthly partitions for the lookahead
  # window (current month .. +lookahead), drops monthly partitions whose ENTIRE range is
  # older than the retention window (dropping a partition removes its rows BY DESIGN —
  # this is the retention mechanism, D22), and deletes older rows from the DEFAULT
  # partition in bounded batches (batch size x max batches per pass). All time math is
  # UTC. Single-instance note (D22): every instance would run the job — the DDL/DELETE
  # are idempotent, but stagger the cron or disable the job on extra replicas.
  retention:
    enabled: ${RETENTION_ENABLED:true}
    months: ${RETENTION_MONTHS:24}
    lookahead-months: ${RETENTION_LOOKAHEAD_MONTHS:3}
    default-delete-batch-size: ${RETENTION_DEFAULT_DELETE_BATCH_SIZE:1000}
    max-batches-per-run: ${RETENTION_MAX_BATCHES_PER_RUN:10}
    schedule-cron: "${RETENTION_CRON:0 30 3 * * *}"

# OpenAPI/Swagger are disabled by default and enabled per profile (dev for humans,
# test for the OpenAPI integration tests). Documentation requires the API key like any
# other endpoint.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
