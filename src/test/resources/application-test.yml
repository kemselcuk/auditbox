# Test profile: used by the Testcontainers integration test. The datasource URL and
# credentials are provided by @ServiceConnection at runtime. The entries below make the
# configuration choices explicit and independent of base-file defaults.
spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Test-only shutdown tweak: Spring Boot's graceful shutdown waits for active requests
  # in EVERY cached test context when the forked JVM exits; with ~20 @SpringBootTest
  # contexts that wait added up past surefire's 30-second forked-JVM exit timeout
  # ("Surefire is going to kill self fork JVM. The exit has elapsed 30 seconds..."),
  # making every full run end in a kill. Tests have no requests to drain at exit;
  # immediate shutdown keeps the exit clean. Production keeps the framework default.
  lifecycle:
    timeout-per-shutdown-phase: 0s
server:
  shutdown: immediate

# API key registry for the integration tests (D5/D18/T5.1): every request that needs
# authentication sends X-API-Key: test-api-key. The configured value is the SHA-256
# digest of that plaintext key — the plaintext key is never stored; requests authenticate
# as the source name "test-client".
auditbox:
  security:
    api-keys: test-client:4c806362b613f7496abf284146efd31da90e4b16169fe001841ca17290f427c4
  # Rate limiting (M10.2/D19) must never interfere with the other integration tests: the
  # shared test source gets a bucket large enough that no realistic test volume exhausts
  # it. The dedicated rate-limit scenario overrides the value itself.
  rate-limit:
    requests-per-minute: 1000000

# The OpenAPI test reads /v3/api-docs; re-enabled here because the base configuration
# disables springdoc (D5: docs are dev-profile-only for humans).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
