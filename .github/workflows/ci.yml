# CI: build and test with the real PostgreSQL via Testcontainers, and validate
# the container image. Runs on pushes and pull requests targeting main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload SBOM
        # Always: the CycloneDX SBOM of the build (target/bom.json, produced by the
        # cyclonedx-maven-plugin during package) is uploaded on every run, even when a
        # later step fails. The file is small (a few hundred KB of JSON).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build container image
        run: docker build -t auditbox:ci .
