# AuditBox local stack.
# Start only the database (used with the app's "local" profile):  docker compose up -d db
# Start the full stack (database + containerized app):           docker compose --profile app up --build -d
# Stop and keep data:   docker compose down
# Stop and delete data: docker compose down -v
#
# All variables are optional; defaults are safe for local development and can be
# overridden via a .env file (see .env.example).

name: auditbox

services:
  db:
    image: postgres:18-alpine
    container_name: auditbox-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-auditbox}
      POSTGRES_USER: ${DB_USER:-auditbox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auditbox}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # postgres:18 moved the volume mount point from /var/lib/postgresql/data
      # to /var/lib/postgresql (PGDATA is now /var/lib/postgresql/18/docker).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-auditbox} -d ${DB_NAME:-auditbox}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Application container (opt-in, Milestone 9.2). Not started by the default
  # db-only workflow: add the "app" profile, e.g. docker compose --profile app up --build -d.
  app:
    build: .
    image: auditbox:local
    container_name: auditbox-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The app runs with the local profile inside the container; DB_HOST points
      # at the compose "db" service instead of localhost.
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-auditbox}
      DB_USER: ${DB_USER:-auditbox}
      DB_PASSWORD: ${DB_PASSWORD:-auditbox}
      # Same safe local default as the local profile (local-dev-key);
      # override via .env for anything reachable by others.
      API_KEY: ${API_KEY:-local-dev-key}
    ports:
      - "8080:8080"

volumes:
  db-data:
    name: auditbox-db-data
