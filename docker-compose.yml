# AuditBox local stack.
# Start only the database (used with the app's "local" profile):  docker compose up -d db
# Stop and keep data:   docker compose down
# Stop and delete data: docker compose down -v
#
# All variables are optional; defaults are safe for local development and can be
# overridden via a .env file (see .env.example).

name: auditbox

services:
  db:
    image: postgres:18-alpine
    container_name: auditbox-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-auditbox}
      POSTGRES_USER: ${DB_USER:-auditbox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auditbox}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # postgres:18 moved the volume mount point from /var/lib/postgresql/data
      # to /var/lib/postgresql (PGDATA is now /var/lib/postgresql/18/docker).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-auditbox} -d ${DB_NAME:-auditbox}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
    name: auditbox-db-data
